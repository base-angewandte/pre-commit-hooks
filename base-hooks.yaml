default_language_version:
  python: python3
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
        exclude: compose.*.yaml
      - id: check-yaml
        name: check-compose-yaml
        files: compose.*.yaml
        args: [--unsafe]
  - repo: https://github.com/PyCQA/docformatter
    rev: v1.7.8
    hooks:
      - id: docformatter
        args: [--in-place]
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      # skipped by default because docker -> better dev UX
      - id: hadolint
        name: Lint Dockerfiles (CI)
      # skipped in CI because doesn't work in runner container
      - id: hadolint-docker
        name: Lint Dockerfiles (local)
  - repo: https://github.com/IamTheFij/docker-pre-commit
    rev: v3.0.1
    hooks:
      - id: docker-compose-check
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.8
    hooks:
      - id: biome-check
        types_or: [css, javascript, json]
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown
        language: node
        types_or: [markdown, yaml]
        additional_dependencies: ["prettier@3.9.5"]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.3
    hooks:
      - id: pip-compile
        name: pip-compile requirements.in
        args: [requirements.in, -o, requirements.txt]
        files: ^requirements\.(in|txt)$
      - id: pip-compile
        name: pip-compile requirements-dev.in
        args: [requirements-dev.in, -o, requirements-dev.txt]
        files: ^requirements-dev\.(in|txt)$
      - id: pip-compile
        name: pip-compile src/requirements.in
        args: [src/requirements.in, -o, src/requirements.txt]
        files: ^src\/requirements\.(in|txt)$
      - id: pip-compile
        name: pip-compile src/requirements-dev.in
        args: [src/requirements-dev.in, -o, src/requirements-dev.txt]
        files: ^src\/requirements-dev\.(in|txt)$
      - id: pip-compile
        name: pip-compile docker/docs/requirements.in
        args: [docker/docs/requirements.in, -o, docker/docs/requirements.txt]
        files: ^docker\/docs\/requirements\.(in|txt)$
